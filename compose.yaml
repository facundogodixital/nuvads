name: nuvede

services:
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:?Definir WEB_PORT en .env.docker}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:?Definir LOCAL_UID en .env.docker}
        LOCAL_GID: ${LOCAL_GID:?Definir LOCAL_GID en .env.docker}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:?Definir MYSQL_DATABASE en .env.docker}
      DB_USERNAME: ${MYSQL_USER:?Definir MYSQL_USER en .env.docker}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD en .env.docker}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${MONGO_DATABASE:?Definir MONGO_DATABASE en .env.docker}
      MONGODB_USERNAME: ${MONGO_USER:?Definir MONGO_USER en .env.docker}
      MONGODB_PASSWORD: ${MONGO_PASSWORD:?Definir MONGO_PASSWORD en .env.docker}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Definir REDIS_PASSWORD en .env.docker}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  node:
    image: node:24-bookworm-slim
    user: "${LOCAL_UID}:${LOCAL_GID}"
    working_dir: /var/www/html
    init: true
    # El servidor de Vue se iniciará cuando instalemos el frontend.
    command: ["sleep", "infinity"]
    environment:
      PORT: ${NODE_PORT:?Definir NODE_PORT en .env.docker}
      npm_config_cache: /tmp/npm-cache
    ports:
      - "127.0.0.1:${NODE_PORT}:${NODE_PORT}"
    volumes:
      - .:/var/www/html

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:?Definir MYSQL_PORT en .env.docker}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env.docker}
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --execute='SELECT 1' --silent > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGO_PORT:?Definir MONGO_PORT en .env.docker}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Definir MONGO_ROOT_USER en .env.docker}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Definir MONGO_ROOT_PASSWORD en .env.docker}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USER: ${MONGO_USER}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./docker/mongo/data:/data/db
      - ./docker/mongo/config:/data/configdb
      - ./docker/mongodb/init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$${MONGO_APP_USER}" --password "$${MONGO_APP_PASSWORD}"
          --authenticationDatabase "$${MONGO_INITDB_DATABASE}"
          --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:?Definir REDIS_PORT en .env.docker}:6379"
    volumes:
      - ./docker/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
